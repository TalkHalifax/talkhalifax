# Keeps the Transit map's fixed data current. Checks Halifax Transit's GTFS schedule each week; when a new one has started,
# rebuilds the data, runs the tests, commits it to main and starts a deploy (a push made with GITHUB_TOKEN doesn't start
# one by itself). The Worker's cron warns the editor a week before the current schedule ends, in case this doesn't run.
#
# The Worker's cron starts this once a week (src/github-jobs.ts), because GitHub's own schedule isn't reliable here.
name: Transit schedule

on:
  workflow_dispatch:

concurrency:
  group: transit-schedule
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Rebuild if there's a new schedule
        run: node scripts/build-transit.mjs --if-new
      - name: See whether anything changed
        id: changed
        run: |
          if git diff --quiet -- src/transit-data.json public/transit/shapes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test the new data
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Commit and deploy
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/transit-data.json public/transit/shapes.json
          git commit -m "Update the Transit map to Halifax Transit's new schedule"
          git push
          gh workflow run deploy.yml --ref main
