# Deploys TalkHalifax to Cloudflare on every push to main (and on demand, from main only).
# Pull requests get the checks and tests only; a failure in either stops the deploy.
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN, a Cloudflare API token with
#   Account › Workers Scripts › Edit   and   Account › D1 › Edit
# The account id is in wrangler.jsonc.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  pull_request:
    paths-ignore: ["README.md"]
  workflow_dispatch:

# Pull request runs: a newer push cancels the older run. Everything else (main): one at a time, never cancelled mid-migration.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Client script parses
        run: for f in public/app.js public/api.js public/chat.js public/views/*.js public/events.js public/alerts.js public/transit.js public/stats.js; do node --check "$f"; done
      - name: Type check the tests
        run: npx tsc -p test
      - name: Unit tests
        run: npm test
      - name: Agent guard tests
        run: npm run test:hooks
      # Drafts of protected files must be promoted (npm run drafts:promote) before they reach main
      - name: No unpromoted drafts
        run: test -z "$(git ls-files protected-drafts | grep -v '^protected-drafts/README.md$')"
      # The real site in a real browser (the runner's Chrome), against a local Worker with throwaway data
      - name: Browser check
        run: npm run test:e2e

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Stamp the site version, v<PR number>, into the footer and the service worker (docs/DESIGN-SYSTEM.md, "Site version").
      # Deploy job only, never committed. Commit subjects are untrusted: only matched, never run or printed.
      - name: Stamp the site version
        id: stamp
        run: |
          git log --first-parent --format='%h%x09%s' -n 1000 HEAD > "$RUNNER_TEMP/subjects"
          merge_re='^Merge pull request #([1-9][0-9]{0,5}) from '
          squash_re='\(#([1-9][0-9]{0,5})\)$'
          n=""; at=""
          while IFS=$'\t' read -r c s; do
            if [[ $s =~ $merge_re ]] || [[ $s =~ $squash_re ]]; then n=${BASH_REMATCH[1]}; at=$c; break; fi
          done < "$RUNNER_TEMP/subjects"
          if [ -z "$n" ]; then echo "::error::No merge commit with a PR number in history; refusing to deploy an unstamped site"; exit 1; fi
          v="v$n"
          once() { local c; c=$(grep -oF -- "$2" "$1" | wc -l || true); [ "$c" -eq "$3" ] || { echo "::error file=$1::expected $3 of a stamp string, found $c"; exit 1; }; }
          once public/index.html '<span class="sf-ver" id="sfVer">dev</span>' 1
          once public/sw.js 'const BUILD = "dev";' 1
          sed -i "s|<span class=\"sf-ver\" id=\"sfVer\">dev</span>|<span class=\"sf-ver\" id=\"sfVer\">$v</span>|" public/index.html
          sed -i "s|const BUILD = \"dev\";|const BUILD = \"$v\";|" public/sw.js
          once public/index.html "<span class=\"sf-ver\" id=\"sfVer\">$v</span>" 1
          once public/sw.js "const BUILD = \"$v\";" 1
          once public/index.html '<span class="sf-ver" id="sfVer">dev</span>' 0
          once public/sw.js 'const BUILD = "dev";' 0
          [ "$(git diff --name-only | sort | tr '\n' ' ')" = "public/index.html public/sw.js " ] || { echo "::error::the stamp changed something other than the two files"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Stamped $v (from commit $at)"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply talkhalifax --remote
      - name: Deploy
        run: npx wrangler deploy
      # Load the live site. If it's broken, go back to the previous version (database migrations stay applied)
      - name: Smoke test
        id: smoke
        env:
          SITE_VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          [[ $SITE_VERSION =~ ^v[0-9]+$ ]] || { echo "::error::no site version"; exit 1; }
          B=https://talkhalifax.alexwmmolloy.workers.dev
          check() {
            curl -sf -m 20 "$B/" | grep -q TalkHalifax &&
            curl -sf -m 20 "$B/" | grep -qF "id=\"sfVer\">$SITE_VERSION<" &&
            curl -sf -m 20 "https://talkhalifax.ca/" | grep -q TalkHalifax &&
            curl -sf -m 20 "$B/api/stories" | grep -q '"stories"' &&
            curl -sf -m 20 "$B/api/alerts" | grep -q '"alerts"'
          }
          for i in 1 2 3 4 5; do
            if check; then echo "Site is up"; exit 0; fi
            echo "Attempt $i failed"; sleep 10
          done
          exit 1
      - name: Roll back
        if: failure() && steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --yes --message "Smoke test failed for ${GITHUB_SHA::7}"
